name: Validate Skill Tree

on:
  pull_request:
  push:
    branches: [main]

# Least privilege by default; the single job grants only read.
permissions: {}

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate SKILL_TREE.md and skill frontmatter
        run: bash scripts/build-skill-tree.sh --check

      - name: Ensure no external monitoring-vendor references
        run: |
          # This repo must be Bugsee-only. This guard hard-fails on the primary
          # competitor's name only (the broader no-other-vendor rule is reviewer-
          # enforced). The needle is hex-encoded so the token never literally
          # appears anywhere in the repo.
          needle="$(printf '\x73\x65\x6e\x74\x72\x79')"
          if grep -rIil "$needle" . --exclude-dir=.git --exclude-dir=node_modules ; then
            echo "::error::Found a forbidden external-vendor reference. This repo must be Bugsee-only."
            exit 1
          fi
          echo "OK — no forbidden references."
