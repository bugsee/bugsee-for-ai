name: Notify docs

# docs.bugsee.com serves generated copies of the SDK skills in this repo
# (bugsee/docs: scripts/mirror-skills.mjs). When skills/ changes on main, tell that repo to
# open its sync PR right away instead of waiting for its scheduled poll.
#
# Authenticates as a GitHub App (not a person): the app's client ID is the repository VARIABLE
# SYNC_APP_CLIENT_ID and its private key is the SECRET SYNC_APP_PRIVATE_KEY of the "skills-sync"
# environment (restricted to the main branch, so a feature-branch workflow cannot read it). The app
# needs "Contents: write" on bugsee/docs only (that is what repository_dispatch requires). A
# short-lived token is minted per run and scoped down to that one repo.
#
# Without those two values this workflow does NOT fail — it logs a notice and docs picks the
# change up on its next scheduled sync (every 6 hours).

on:
  push:
    branches: [main]
    paths:
      - 'skills/**'
  workflow_dispatch:

permissions: {}

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # The app's private key lives in this environment, which only the main branch may use.
    environment: skills-sync
    env:
      SYNC_APP_CLIENT_ID: ${{ vars.SYNC_APP_CLIENT_ID }}
      SYNC_APP_PRIVATE_KEY: ${{ secrets.SYNC_APP_PRIVATE_KEY }}
    steps:
      - name: Mint a short-lived token for bugsee/docs
        id: app
        if: env.SYNC_APP_CLIENT_ID != '' && env.SYNC_APP_PRIVATE_KEY != ''
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.SYNC_APP_CLIENT_ID }}
          private-key: ${{ secrets.SYNC_APP_PRIVATE_KEY }}
          owner: bugsee
          repositories: docs
          permission-contents: write

      - name: Ask bugsee/docs to sync
        if: steps.app.outputs.token != ''
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          curl -fsS -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/bugsee/docs/dispatches \
            -d '{"event_type":"bugsee-for-ai-updated","client_payload":{"sha":"${{ github.sha }}"}}'
          echo "Dispatched bugsee-for-ai-updated to bugsee/docs for ${{ github.sha }}"

      - name: Skipped (GitHub App not configured)
        if: steps.app.outputs.token == ''
        run: echo "::notice::SYNC_APP_CLIENT_ID / SYNC_APP_PRIVATE_KEY are not set; bugsee/docs will pick this change up on its next scheduled sync (every 6 hours)."
