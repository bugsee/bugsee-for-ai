name: Notify docs

# docs.bugsee.com serves generated copies of the SDK skills in this repo
# (bugsee/docs: scripts/mirror-skills.mjs). When skills/ changes on main, tell that repo to
# open its sync PR right away instead of waiting for its scheduled poll.
#
# Needs the DOCS_SYNC_TOKEN repository secret: a fine-grained PAT or GitHub App token with
# "Contents: write" on bugsee/docs (that is what the repository_dispatch API requires).
# Without the secret this workflow does NOT fail — it logs a notice and docs picks the change up
# on its next scheduled sync (every 6 hours).

on:
  push:
    branches: [main]
    paths:
      - 'skills/**'
  workflow_dispatch:

permissions: {}

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      DOCS_SYNC_TOKEN: ${{ secrets.DOCS_SYNC_TOKEN }}
    steps:
      - name: Ask bugsee/docs to sync
        if: env.DOCS_SYNC_TOKEN != ''
        run: |
          curl -fsS -X POST \
            -H "Authorization: Bearer ${DOCS_SYNC_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/bugsee/docs/dispatches \
            -d '{"event_type":"bugsee-for-ai-updated","client_payload":{"sha":"${{ github.sha }}"}}'
          echo "Dispatched bugsee-for-ai-updated to bugsee/docs for ${{ github.sha }}"

      - name: Skipped (no token)
        if: env.DOCS_SYNC_TOKEN == ''
        run: echo "::notice::DOCS_SYNC_TOKEN is not set; bugsee/docs will pick this change up on its next scheduled sync (every 6 hours)."
